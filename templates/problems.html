<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Problems</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
  <nav class="nav">
    <div class="shell nav-inner">
      <a class="brand" href="/"><span class="brand-mark">DS</span><span>DSA Platform</span></a>
      <div class="nav-links">
        <a href="/dashboard">Dashboard</a>
        <a href="/learn">Roadmap</a>
        <a href="/feedback">Feedback</a>
        <button class="icon-btn" onclick="toggleTheme()" title="Toggle theme">Theme</button>
        <a href="/logout">Logout</a>
      </div>
    </div>
  </nav>

  <main class="shell page">
    <div class="row" style="justify-content: space-between;">
      <div>
        <div class="eyebrow">100 problem roadmap</div>
        <h1 class="page-title">Practice problems</h1>
      </div>
      <span class="pill" id="count">{{ questions|length }} problems</span>
    </div>

    <section class="filters">
      <input class="input" id="search" placeholder="Search title, topic, tag">
      <select id="topic">
        <option value="">All topics</option>
        {% for topic in topics %}<option value="{{ topic }}">{{ topic }}</option>{% endfor %}
      </select>
      <select id="difficulty">
        <option value="">All difficulty</option>
        <option>Easy</option>
        <option>Medium</option>
        <option>Hard</option>
      </select>
      <select id="status">
        <option value="">All status</option>
        <option value="solved">Solved</option>
        <option value="unsolved">Unsolved</option>
      </select>
      <select id="list">
        <option value="">All lists</option>
        <option value="blind75">Blind 75</option>
        <option value="neetcode150">NeetCode 150</option>
      </select>
    </section>

    <section id="problem-list">
      {% for q in questions %}
      <a class="problem-row" href="/question/{{ q.id }}">
        <span class="muted">{{ loop.index }}</span>
        <span>
          <span class="problem-title">{{ q.title }}</span>
          <span class="problem-desc">{{ q.description }}</span>
        </span>
        <span class="row">
          {% if q.solved %}<span class="pill">Solved</span>{% endif %}
          <span class="{{ q.difficulty|lower }}">{{ q.difficulty }}</span>
          <span class="pill">{{ q.topic }}</span>
        </span>
      </a>
      {% endfor %}
    </section>
  </main>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  <script>
    const fields = ["search", "topic", "difficulty", "status", "list"].map(id => document.getElementById(id));
    fields.forEach(field => field.addEventListener("input", loadProblems));
    async function loadProblems() {
      const params = new URLSearchParams({
        q: document.getElementById("search").value,
        topic: document.getElementById("topic").value,
        difficulty: document.getElementById("difficulty").value,
        status: document.getElementById("status").value,
        list: document.getElementById("list").value,
      });
      const res = await fetch(`/api/problems?${params}`);
      const data = await res.json();
      document.getElementById("count").innerText = `${data.problems.length} problems`;
      document.getElementById("problem-list").innerHTML = data.problems.map((q, index) => `
        <a class="problem-row" href="/question/${q.id}">
          <span class="muted">${index + 1}</span>
          <span>
            <span class="problem-title">${q.title}</span>
            <span class="problem-desc">${q.description || ""}</span>
          </span>
          <span class="row">
            ${q.solved ? '<span class="pill">Solved</span>' : ''}
            <span class="${q.difficulty.toLowerCase()}">${q.difficulty}</span>
            <span class="pill">${q.topic}</span>
          </span>
        </a>
      `).join("");
    }
  </script>
</body>
</html>
